# Release: on a v* tag, package and upload the installable zip
# (dist/rssh-<id>-<version>.zip) to the release. The release object itself is
# created by hand on GitHub — CI only attaches assets.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # --clobber: re-runs and re-pushed tags replace the same-named asset
        # instead of failing; the release must already exist (created by hand).
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
